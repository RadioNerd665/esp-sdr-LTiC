name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test artifact export
        run: python3 -m unittest discover -s tests
      - id: catalog
        run: echo "matrix=$(python3 tools/build_firmware.py --matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check out pinned ESP-IDF
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: ${{ matrix.idf_ref }}
          path: .esp-idf
          submodules: recursive
      - name: Cache SDK tools
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: idf-${{ runner.os }}-${{ runner.arch }}-${{ matrix.idf_ref }}-${{ matrix.target }}
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf cmake ninja-build ccache libffi-dev libssl-dev python3-venv libusb-1.0-0
      - name: Install SDK tools
        env:
          IDF_TARGET_NAME: ${{ matrix.target }}
        run: .esp-idf/install.sh "$IDF_TARGET_NAME"
      - name: Build and export
        shell: bash
        env:
          PROFILE: ${{ matrix.id }}
          FIRMWARE_VERSION: ${{ github.sha }}
        run: |
          source .esp-idf/export.sh
          python tools/build_firmware.py --profile "$PROFILE" --version "$FIRMWARE_VERSION" --output artifacts
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.id }}
          path: artifacts/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.id }}
          path: |
            build-${{ matrix.id }}/log/
            build-${{ matrix.id }}/sdkconfig
          retention-days: 7

  bundle:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: downloaded-firmware
          merge-multiple: false
      - name: Collect firmware and combined manifest
        run: python3 tools/collect_firmware.py --input downloaded-firmware --output firmware --catalog firmware-targets.json
      - name: Upload complete firmware set
        uses: actions/upload-artifact@v4
        with:
          name: esp-sdr-firmware
          path: firmware/
          if-no-files-found: error
          retention-days: 90

  pages:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out ESP-WebSDR
        uses: actions/checkout@v4
        with:
          repository: ESPARGOS/esp-web-sdr
          ref: 6995ed78915a034be54be68abf986d608d7624c4
          path: viewer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test viewer
        working-directory: viewer
        run: node --test tests/*.test.mjs
      - name: Download this build's firmware
        uses: actions/download-artifact@v4
        with:
          name: esp-sdr-firmware
          path: site/firmware
      - name: Assemble site
        run: |
          set -euo pipefail
          cp viewer/*.html viewer/*.js viewer/*.css viewer/*.svg viewer/favicon-*.png site/
          cp -R viewer/flasher site/flasher
          cp viewer/LICENSE site/VIEWER-LICENSE
          test -s site/firmware/manifest.json
          (cd site && zip -qr firmware.zip firmware)
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
